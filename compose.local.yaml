name: ai-interview-local
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_interview_coach
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.local}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U interview -d ai_interview_coach']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    image: ai-interview-backend:local
    restart: unless-stopped
    stop_grace_period: 130s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/ai_interview_coach
      DATABASE_USER: interview
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.local}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./ai-interview-frontend
    image: ai-interview-frontend:local
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  uploads:

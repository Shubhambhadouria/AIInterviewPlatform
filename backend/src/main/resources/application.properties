spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_interview_coach}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.persist-authorization=true
app.file.upload-dir=${UPLOAD_DIR:uploads/resumes}
app.file-storage.maximum-file-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

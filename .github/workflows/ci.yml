name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interview_test
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U interview -d interview_test" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/interview_test
      TEST_POSTGRES_PASSWORD: ci-test-password
      DATABASE_USER: interview
      DATABASE_PASSWORD: ci-compose-test-password
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      GEMINI_API_KEY: ci-placeholder-not-a-live-key
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-interview-frontend/package-lock.json
      - run: npm ci && npm audit --audit-level=moderate && npm run lint && npm run build
        working-directory: ai-interview-frontend
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: node scripts/smoke.mjs http://127.0.0.1:8080
      - run: docker compose logs --tail=100 && docker compose down -v
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/

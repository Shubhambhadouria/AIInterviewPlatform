services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_interview_coach
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d ai_interview_coach']
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 130s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/ai_interview_coach
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRATION: 3600000
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./ai-interview-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  uploads:
